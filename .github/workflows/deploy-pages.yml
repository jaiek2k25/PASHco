name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ as a static site.
# Note: Pages is static-only, so accounts and the AI proxy are unavailable
# there. Use the Node server (see DEPLOY.md) for the full product.

on:
  push:
    branches:
      - main
      - arena/fa25e4b3-pashco
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build
        env:
          # Project sites are served from /<repo>/, so the base path must match.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_HOST: 'true'
        run: npm run build

      # A static host has no rewrite rules. Serving index.html as 404 keeps
      # deep links like /PASHco/tutor working, since the router reads the path.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      # Switches the repo from "serve a branch" to "deploy this artifact".
      # Without it the site would publish raw source files instead of the build.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
