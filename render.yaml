# Render Blueprint for WeSolve.
#
# Render > New > Blueprint > pick this repo. No card and no disk needed to get
# AI working: each signed-in or guest user forwards their own key, and the
# server makes the provider call.
#
# Accounts are stored under WESOLVE_DATA_DIR. On the free plan that storage is
# ephemeral, so accounts reset when the instance restarts. Switch to plan
# starter and attach the disk block below to keep accounts permanently.
services:
  - type: web
    name: wesolve
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: node server/production.js
    healthCheckPath: /api/ai/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WESOLVE_SESSION_SECRET
        generateValue: true
      # Allow the GitHub Pages build to call this API from another origin.
      - key: WESOLVE_ALLOWED_ORIGINS
        value: https://jaiek2k25.github.io
      # Optional: a site-wide key. Off by default — every user brings their own.
      - key: NVIDIA_API_KEY
        sync: false
# Persistent accounts: change plan to "starter" and uncomment the disk lines.
