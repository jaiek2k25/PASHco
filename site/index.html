<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3155ff" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WeSolve — AI study tools built for students" />
    <meta property="og:description" content="Solve homework step by step, learn on an AI whiteboard, and turn your notes into flashcards, quizzes, and exam plans." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="An AI study workspace with a step-by-step solver, flashcards, quizzes, study guides, exam prep, live notes, and a whiteboard tutor." />
    <link rel="icon" type="image/svg+xml" href="/PASHco/favicon.svg" />
    <style>
      /* Shown until React paints over it, so the first frame is never blank white. */
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f7f8fc; color: #20232e; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; z-index: 5; }
      .boot-inner { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 24px; max-width: 520px; }
      .boot-mark { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
      .boot-mark span { color: #3155ff; }
      .boot-bar { width: 132px; height: 4px; border-radius: 99px; background: #dfe3f0; overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #3155ff, #7c4dff); animation: boot-slide 1.1s ease-in-out infinite; }
      .boot-hint { font-size: 13px; color: #6b7280; }
      .boot-error { display: none; text-align: left; font-size: 13px; color: #b42318; background: #fff; border: 1px solid #fecdca; border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
      .boot-error.is-visible { display: block; }
      @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; width: 100%; } }
    </style>
    <script>
      // The dev server injects /src/main.jsx below. A statically hosted copy of
      // this file (GitHub Pages) has no build step, so that request fails — load
      // the prebuilt bundle from site/ instead of showing a blank page.
      (function () {
        var bootTimer = null
        var staticStarted = false

        function showBootError(message) {
          var box = document.getElementById('boot-error')
          if (!box || !document.getElementById('root') || !document.querySelector('.boot-splash')) return
          box.textContent = message
          box.className = 'boot-error is-visible'
          var hint = document.getElementById('boot-hint')
          if (hint) hint.textContent = 'Reload the page to try again.'
        }

        function staticBase() {
          // Directory of the current page: "/PASHco/" for a project site, "/" for a domain.
          return location.pathname.replace(/[^/]*$/, '') + 'site/'
        }

        function loadStaticBuild() {
          if (staticStarted) return true
          staticStarted = true
          if (bootTimer) clearTimeout(bootTimer)
          var hint = document.getElementById('boot-hint')
          if (hint) hint.textContent = 'Starting WeSolve…'
          var base = staticBase()
          var link = document.createElement('link')
          link.rel = 'stylesheet'
          link.href = base + 'app.css'
          document.head.appendChild(link)
          import(/* @vite-ignore */ base + 'app.js').catch(function (error) {
            showBootError('Could not load the app build (' + base + 'app.js): ' + (error && error.message ? error.message : error))
          })
          return true
        }

        window.__wesolveLoadStaticBuild = loadStaticBuild

        window.addEventListener('error', function (event) {
          if (event && event.target && event.target !== window && event.target.tagName === 'SCRIPT') {
            var src = event.target.src || ''
            if (/\/src\/main\.jsx$/.test(src) && loadStaticBuild()) return
            showBootError('Could not load ' + (src || 'an app script') + '.')
            return
          }
          showBootError((event && event.message) || 'The app could not start.')
        }, true)

        window.addEventListener('unhandledrejection', function (event) {
          showBootError('The app could not start: ' + ((event.reason && (event.reason.message || event.reason)) || 'unknown error'))
        })

        bootTimer = window.setTimeout(function () {
          if (document.querySelector('.boot-splash') && !document.querySelector('.boot-error.is-visible')) {
            showBootError('The app is taking longer than expected to load.')
          }
        }, 12000)
      })()
    </script>
    <title>WeSolve — AI Study Tools built for students</title>
    <script type="module" crossorigin src="/PASHco/app.js"></script>
    <link rel="stylesheet" crossorigin href="/PASHco/assets/style-XN3eezIp.css">
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-inner">
          <span class="boot-mark">wesolve<span>.ai</span></span>
          <div class="boot-bar" aria-hidden="true"></div>
          <p class="boot-hint" id="boot-hint">Setting up your study workspace…</p>
          <pre class="boot-error" id="boot-error"></pre>
        </div>
      </div>
    </div>
  </body>
</html>
